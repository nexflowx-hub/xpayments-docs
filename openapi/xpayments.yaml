openapi: 3.1.0
info:
  title: XPayments Payments API
  version: 3.1.0
  description: |
    Public payment contract for XPayments Native S2S, Checkout XPay and
    Stripe-compatible Direct.

    Payment creation is not financial finality. Merchants should finalize
    orders from verified XPayments transaction state / Merchant webhooks.
servers:
  - url: https://api.xpayments.digital
    description: Production API
tags:
  - name: System
  - name: Native S2S
  - name: Checkout XPay
  - name: Stripe-compatible Direct
paths:
  /api/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: API health
      security: []
      responses:
        '200':
          description: XPayments API is online
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                success: true
                version: 3.1.0
                engine: XPayments
                status: ONLINE

  /api/v1/payments/charge:
    post:
      tags: [Native S2S]
      operationId: createNativePayment
      summary: Create a Store-scoped Native payment
      description: |
        Creates a payment using the Store routing configuration. Amount is an
        integer in minor units. Method-specific responses/actions can be
        returned for flows such as PIX, MB WAY, Multibanco and Bizum.
      security:
        - xApiKey: []
        - paymentBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativePaymentCreateRequest'
            examples:
              pix:
                summary: PIX R$ 5.00
                value:
                  amount: 500
                  currency: BRL
                  payment_method_types: [pix]
                  reference: ORDER-BR-1001
                  customer:
                    name: Customer Name
                    document: '12345678900'
                  metadata:
                    order_id: ORDER-BR-1001
              mbWay:
                summary: MB WAY EUR 12.99
                value:
                  amount: 1299
                  currency: EUR
                  payment_method_types: [mb_way]
                  reference: ORDER-PT-1001
                  customer:
                    name: Customer Name
                    email: customer@example.com
                    phone: '+351911111111'
                  metadata:
                    order_id: ORDER-PT-1001
              multibanco:
                summary: Multibanco EUR 25.00
                value:
                  amount: 2500
                  currency: EUR
                  payment_method_types: [multibanco]
                  reference: ORDER-MB-1001
                  customer:
                    name: Customer Name
                    email: customer@example.com
                  metadata:
                    order_id: ORDER-MB-1001
              bizum:
                summary: Bizum EUR 19.99
                value:
                  amount: 1999
                  currency: EUR
                  payment_method_types: [bizum]
                  reference: ORDER-ES-1001
                  customer:
                    name: Customer Name
                    email: customer@example.com
                    phone: '+34600000001'
                  metadata:
                    order_id: ORDER-ES-1001
                    return_url: https://shop.example.com/checkout/complete
      responses:
        '200':
          description: Payment created or provider action returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativePaymentResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/checkout/session:
    post:
      tags: [Checkout XPay]
      operationId: createCheckoutSession
      summary: Create a Checkout XPay session
      security:
        - paymentBearer: []
        - xApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckoutSessionRequest'
            example:
              amount: 2599
              currency: EUR
              reference: ORDER-1001
              customerEmail: customer@example.com
              metadata:
                order_id: ORDER-1001
      responses:
        '201':
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCheckoutSessionResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/checkout/session/{sessionId}:
    get:
      tags: [Checkout XPay]
      operationId: getCheckoutSession
      summary: Load a public Checkout XPay session
      security: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Public checkout session data and Store methods/branding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSessionResponse'
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/v1/checkout/initiate:
    post:
      tags: [Checkout XPay]
      operationId: initiateCheckoutPayment
      summary: Initiate selected Checkout payment method
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutInitiateRequest'
            example:
              sessionId: 00000000-0000-0000-0000-000000000000
              paymentMethod: mb_way
              customer:
                name: Customer Name
                email: customer@example.com
                phone: '+351911111111'
      responses:
        '200':
          description: Underlying provider payment/action
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410':
          description: Checkout session expired

  /api/stripe/v1/payment_intents:
    post:
      tags: [Stripe-compatible Direct]
      operationId: createPaymentIntent
      summary: Create a Store-bound Stripe-compatible PaymentIntent
      description: |
        XPayments resolves the Store from the xp_* key, validates the active
        Stripe-compatible route, creates/binds an XPayments Transaction and then
        performs the provider PaymentIntent operation.
      security:
        - stripeBasic: []
        - paymentBearer: []
        - xApiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/StripeVersion'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StripePaymentIntentCreate'
            examples:
              automaticMethods:
                value:
                  amount: 2599
                  currency: eur
                  automatic_payment_methods[enabled]: 'true'
                  metadata[merchant_reference]: ORDER-1001
              cardOnly:
                value:
                  amount: 2599
                  currency: eur
                  payment_method_types[]: [card]
                  metadata[merchant_reference]: ORDER-1001
      responses:
        '200':
          description: Stripe-compatible PaymentIntent
          headers:
            X-XPayments-Idempotent-Replay:
              description: `true` when XPayments returns the existing bound PaymentIntent for an idempotent replay.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StripePaymentIntent' }
        '400': { $ref: '#/components/responses/StripeBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502':
          description: Provider/upstream failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StripeErrorEnvelope' }

  /api/stripe/v1/payment_intents/{paymentIntentId}:
    get:
      tags: [Stripe-compatible Direct]
      operationId: getPaymentIntent
      summary: Retrieve a Store-bound PaymentIntent
      security:
        - stripeBasic: []
        - paymentBearer: []
        - xApiKey: []
      parameters:
        - $ref: '#/components/parameters/PaymentIntentId'
        - $ref: '#/components/parameters/StripeVersion'
      responses:
        '200':
          description: PaymentIntent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StripePaymentIntent' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Stripe-compatible Direct]
      operationId: updatePaymentIntent
      summary: Update a Store-bound PaymentIntent
      security:
        - stripeBasic: []
        - paymentBearer: []
        - xApiKey: []
      parameters:
        - $ref: '#/components/parameters/PaymentIntentId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/StripeVersion'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Updated PaymentIntent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StripePaymentIntent' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/stripe/v1/payment_intents/{paymentIntentId}/confirm:
    post:
      tags: [Stripe-compatible Direct]
      operationId: confirmPaymentIntent
      summary: Confirm a Store-bound PaymentIntent server-side
      description: Browser card flows should normally confirm with Stripe.js / Payment Element.
      security:
        - stripeBasic: []
        - paymentBearer: []
        - xApiKey: []
      parameters:
        - $ref: '#/components/parameters/PaymentIntentId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/StripeVersion'
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Confirmation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StripePaymentIntent' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/stripe/v1/payment_intents/{paymentIntentId}/cancel:
    post:
      tags: [Stripe-compatible Direct]
      operationId: cancelPaymentIntent
      summary: Cancel a Store-bound PaymentIntent
      security:
        - stripeBasic: []
        - paymentBearer: []
        - xApiKey: []
      parameters:
        - $ref: '#/components/parameters/PaymentIntentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Canceled PaymentIntent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StripePaymentIntent' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/stripe/v1/payment_intents/{paymentIntentId}/capture:
    post:
      tags: [Stripe-compatible Direct]
      operationId: capturePaymentIntent
      summary: Capture a Store-bound PaymentIntent
      security:
        - stripeBasic: []
        - paymentBearer: []
        - xApiKey: []
      parameters:
        - $ref: '#/components/parameters/PaymentIntentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Captured PaymentIntent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StripePaymentIntent' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    paymentBearer:
      type: http
      scheme: bearer
      description: Store-scoped XPayments payment key (`xp_test_*` / `xp_live_*`).
    stripeBasic:
      type: http
      scheme: basic
      description: Stripe-style HTTP Basic with the Store `xp_*` key as username and empty password.
    xApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Store-scoped XPayments payment key.

  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentIntentId:
      name: paymentIntentId
      in: path
      required: true
      schema: { type: string, pattern: '^pi_' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Stable key for the same logical payment attempt/retry.
      schema: { type: string, maxLength: 255 }
    StripeVersion:
      name: Stripe-Version
      in: header
      required: false
      description: Provider API version preference forwarded/preserved where supported.
      schema: { type: string }

  schemas:
    HealthResponse:
      type: object
      required: [success, version, engine, status]
      properties:
        success: { type: boolean }
        version: { type: string }
        engine: { type: string }
        status: { type: string }

    NativePaymentCreateRequest:
      type: object
      required: [amount, currency, payment_method_types]
      properties:
        amount:
          type: integer
          minimum: 1
          description: Minor units, e.g. 2599 = EUR 25.99.
        currency:
          type: string
          pattern: '^[A-Za-z]{3}$'
        payment_method_types:
          type: array
          minItems: 1
          items: { type: string }
        reference: { type: string }
        customer:
          type: object
          additionalProperties: true
          properties:
            name: { type: string }
            email: { type: string, format: email }
            phone: { type: string }
            document: { type: string }
        metadata:
          type: object
          additionalProperties: true

    NativePaymentResponse:
      type: object
      additionalProperties: true
      properties:
        success: { type: boolean }
        transactionId: { type: string, format: uuid }
        reference: { type: string }
        status: { type: string }
        method: { type: string }
        action:
          type: object
          additionalProperties: true

    CreateCheckoutSessionRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          minimum: 1
          description: Minor units.
        currency: { type: string, default: EUR }
        reference: { type: string }
        customerEmail: { type: string, format: email }
        metadata:
          type: object
          additionalProperties: true

    CreateCheckoutSessionResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            sessionId: { type: string, format: uuid }
            checkoutUrl: { type: string, format: uri }
            storeCode: { type: string }
            expiresAt: { type: string, format: date-time }

    CheckoutSessionResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            sessionId: { type: string, format: uuid }
            storeId: { type: string, format: uuid }
            storeCode: { type: [string, 'null'] }
            storeName: { type: string }
            amount: { type: number, description: Stored/display amount in major units. }
            currency: { type: string }
            reference: { type: string }
            status: { type: string }
            customerEmail: { type: [string, 'null'] }
            expiresAt: { type: [string, 'null'] }
            checkoutUrl: { type: [string, 'null'] }
            returnUrl: { type: [string, 'null'] }
            primaryColor: { type: [string, 'null'] }
            logoUrl: { type: [string, 'null'] }
            theme: { type: string }
            paymentMethods:
              type: array
              items:
                type: object
                properties:
                  code: { type: string }
                  label: { type: string }
                  provider: { type: string }

    CheckoutInitiateRequest:
      type: object
      required: [sessionId, paymentMethod]
      properties:
        sessionId: { type: string, format: uuid }
        paymentMethod: { type: string }
        customer:
          type: object
          additionalProperties: true

    StripePaymentIntentCreate:
      type: object
      required: [amount, currency]
      additionalProperties: true
      properties:
        amount:
          type: integer
          minimum: 1
          description: Minor units.
        currency: { type: string, example: eur }
        payment_method_types[]:
          type: array
          items: { type: string }
        automatic_payment_methods[enabled]:
          oneOf:
            - { type: boolean }
            - { type: string, enum: ['true', 'false'] }
        receipt_email: { type: string, format: email }
        metadata[merchant_reference]: { type: string }
        metadata[order_id]: { type: string }
        metadata[reference]: { type: string }

    StripePaymentIntent:
      type: object
      additionalProperties: true
      properties:
        id: { type: string, pattern: '^pi_' }
        object: { type: string, const: payment_intent }
        amount: { type: integer }
        amount_received: { type: integer }
        currency: { type: string }
        status: { type: string }
        livemode: { type: boolean }
        client_secret: { type: [string, 'null'] }
        payment_method: { type: [string, 'null'] }
        latest_charge: { type: [string, 'null'] }
        payment_method_types:
          type: array
          items: { type: string }
        metadata:
          type: object
          additionalProperties: true
          properties:
            nexflowx_transaction_id: { type: string, format: uuid }
            merchant_reference: { type: string }
            xpayments_store_id: { type: string, format: uuid }
            xpayments_gateway_vault_id: { type: string, format: uuid }
            xpayments_surface: { type: string }

    StripeErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          additionalProperties: true
          properties:
            type: { type: string }
            code: { type: string }
            message: { type: string }

    StandardError:
      type: object
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

  responses:
    BadRequest:
      description: Invalid request/parameters
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StandardError' }
    StripeBadRequest:
      description: Stripe-compatible invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StripeErrorEnvelope' }
    Unauthorized:
      description: Missing/invalid authentication
    NotFound:
      description: Resource not found or not bound to the authenticating Store
    Conflict:
      description: Existing paid transaction, idempotency conflict or environment/configuration mismatch
    ServerError:
      description: XPayments internal/configuration failure
